server {
    listen 80;

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;

        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}